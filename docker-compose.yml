# ── CatGPT Gateway — Docker Compose ─────────────────────────────
# Runs the full application with headed Chrome inside Docker.
# Uses Xvfb (virtual display) + noVNC (browser-based VNC) for login.
#
# Usage:
#   docker compose up --build       # First time (builds image)
#   docker compose up               # Subsequent runs
#   docker compose logs -f catgpt   # Watch logs
#   docker compose down             # Stop everything
#
# Ports:
#   http://localhost:8000  — FastAPI API (OpenAI-compatible)
#   http://localhost:6080  — noVNC web UI (for login / debugging)

services:
  catgpt:
    build:
      context: .
      dockerfile: Dockerfile
    image: catgpt-gateway
    container_name: catgpt
    restart: unless-stopped

    ports:
      - "8000:8000"   # FastAPI API
      - "6080:6080"   # noVNC web UI

    volumes:
      # Persistent browser session — survives container restarts
      - catgpt_browser_data:/app/browser_data
      # Logs accessible from host
      - ./docker-logs:/app/logs

    environment:
      # Browser (headed on virtual display)
      - HEADLESS=false
      - SLOW_MO=50
      - DISPLAY=:99
      - DISPLAY_WIDTH=1366
      - DISPLAY_HEIGHT=768
      - DISPLAY_DEPTH=24

      # Provider: "chatgpt" or "claude"
      - PROVIDER=chatgpt
      - CATGPT_MODEL=gpt-5.5-pro

      # ChatGPT
      - CHATGPT_URL=https://chatgpt.com

      # Claude
      - CLAUDE_URL=https://claude.ai

      # Timeouts
      - RESPONSE_TIMEOUT=2100000
      - SELECTOR_TIMEOUT=10000
      - LIVENESS_INTERVAL_MS=180000
      - UPLOAD_TIMEOUT=180000

      # Human simulation
      - TYPING_SPEED_MIN=50
      - TYPING_SPEED_MAX=150
      - THINKING_PAUSE_MIN=1000
      - THINKING_PAUSE_MAX=3000

      # Optional: a small OpenRouter model repairs a broken tool-call reply instead of
      # spending another slow ChatGPT round trip. Off unless OPENROUTER_API_KEY is set in
      # your shell or a git-ignored .env next to this file. Only the broken reply and the
      # tool schemas are sent; free-tier models may log prompts.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CATGPT_FORMATTER_MODEL=${CATGPT_FORMATTER_MODEL:-openrouter/free}

      # Optional model bridge. Turns after a tool result, and any request ChatGPT fails to
      # answer (empty reply, or a made-up "that path does not exist"), are served by another
      # model, so a long agent loop does not exhaust ChatGPT's rate limit.
      # CATGPT_BRIDGE_MODEL is one model or a comma-separated list tried in order. Plain ids
      # go to OpenRouter (needs OPENROUTER_API_KEY), e.g. stealth/space-bunny-alpha or
      # openrouter/free; a "huggingface/" prefix goes to the Hugging Face router (needs
      # HF_TOKEN), e.g. huggingface/deepseek-ai/DeepSeek-V4.1-Flash. An entry whose key is
      # unset is skipped. PRIVACY: this sends the real conversation, tool results (file
      # contents) included, to the provider; free and stealth models may log prompts.
      # Empty = off. CATGPT_BRIDGE_ROUTE: continuation (default) or fallback (failures only).
      - CATGPT_BRIDGE_MODEL=${CATGPT_BRIDGE_MODEL:-}
      - CATGPT_BRIDGE_ROUTE=${CATGPT_BRIDGE_ROUTE:-continuation}
      - HF_TOKEN=${HF_TOKEN:-}

      # One fresh temporary chat per request (isolation). Raise to share a chat across
      # that many requests: faster, but earlier requests leak into later ones.
      - CATGPT_THREAD_MESSAGES=${CATGPT_THREAD_MESSAGES:-1}

      # API
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_TOKEN=dummy123

      # VNC Authentication
      - VNC_PASSWORD=catgpt

      # Logging (verbose for Docker)
      - LOG_LEVEL=DEBUG
      - VERBOSE=true

    # Chromium needs these for sandbox
    security_opt:
      - seccomp=unconfined
    shm_size: "2gb"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  catgpt_browser_data:
    driver: local
